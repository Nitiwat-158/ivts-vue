services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mfu_vehicle_track
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mfu_vehicle_track"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend-node/.env.local}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 8082
      BASE_SERVER_URL: ${BASE_SERVER_URL:-http://127.0.0.1:8203}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB: mongodb://mongodb:27017
      AI_TRACK_DATABASE_URL: postgresql://postgres:1234@postgres:5432/mfu_vehicle_track
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8095}:8082"
    volumes:
      - ./ai-track:/app/ai-track:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
      target: server-runner
      args:
        VUE_APP_API_BASE_URL: /
        VUE_APP_SOCKET_URL: same-origin
        VUE_APP_CLIENTID: ${GOOGLE_CLIENT_ID:-}
        VUE_APP_SCOPE: ${GOOGLE_OAUTH_SCOPE:-profile email}
        VUE_APP_PROMPT: ${GOOGLE_OAUTH_PROMPT:-select_account}
        VUE_APP_AUTH_SYSTEM: ${FRONTEND_AUTH_SYSTEM:-ivts}
        VUE_APP_PROJECT_APP_ID: ${FRONTEND_PROJECT_APP_ID:-ivts}
        VUE_APP_PROJECT_PERMISSION_ROOT_PATH: ${FRONTEND_PROJECT_PERMISSION_ROOT_PATH:-/ivts/security/permission}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8086}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-mobile:
    build:
      context: ./user-mobile-application
      dockerfile: Dockerfile
      target: server-runner
      args:
        API_BASE_URL: ${USER_MOBILE_API_BASE_URL:-/api/v1/mobile}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${USER_MOBILE_BIND_IP:-127.0.0.1}:${USER_MOBILE_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s



  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mfu_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"       
      - "8888:8888"       
      - "8889:8889"       
      - "8189:8189/udp"   
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

volumes:
  redis-data:
  mongodb-data:
  postgres-data: